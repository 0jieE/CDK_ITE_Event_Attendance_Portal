{% comment %} School years table fragment. {% endcomment %}
<div class="table-responsive">
  <table class="table table-hover align-middle datatable" id="schoolYearsTable" width="100%">
    <thead>
      <tr>
        <th>School Year</th><th>Semesters</th><th class="text-end no-print">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for obj in objects %}
        <tr>
          <td>{{ obj.sy }}</td>
          <td>{{ obj.semesters.count }}</td>
          <td class="text-end no-print">
            {% if can_edit %}
              <button class="btn btn-sm btn-outline-primary" title="Edit"
                      hx-get="{% url edit_urlname obj.id %}" hx-target="#modalContent" hx-swap="innerHTML">
                <i class="bi bi-pencil"></i>
              </button>
            {% endif %}
            {% if can_delete %}
              <button class="btn btn-sm btn-outline-danger" title="Delete"
                      hx-post="{% url delete_urlname obj.id %}"
                      hx-confirm="Delete school year “{{ obj.sy }}”? Semesters and events under it will also be removed."
                      hx-swap="none">
                <i class="bi bi-trash"></i>
              </button>
            {% endif %}
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
