# Reverse proxy - HTTPS terminated by nginx itself.
#
# Select it with NGINX_CONF=nginx.ssl.conf in .env.prod and place your
# certificate at nginx/certs/fullchain.pem and key at nginx/certs/privkey.pem
# (for example from Let's Encrypt). Port 80 only redirects to HTTPS.
# Pair with USE_HTTPS=True in .env.prod.

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Health probes stay on plain HTTP; everything else goes to HTTPS.
    location = /healthz/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        autoindex off;
        expires 1h;
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
