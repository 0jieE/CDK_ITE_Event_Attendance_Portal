# Reverse proxy - plain HTTP on :80 (default; demo / behind a TLS terminator).
#
# Serves /static/ and /media/ straight from the shared Docker volumes and
# proxies everything else to Gunicorn. For HTTPS terminated by nginx itself use
# nginx/nginx.ssl.conf instead (see DEPLOYMENT.md).

# If a TLS terminator (Cloudflare, ngrok, a cloud load balancer...) sits in
# front of this nginx and already set X-Forwarded-Proto, pass its value through;
# otherwise use the scheme this nginx actually received. Django reads this to
# decide whether a request is secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;          # branding logo upload

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # QR PNGs + branding. Filenames embed an unguessable token and directory
    # listing is off, so the files cannot be enumerated.
    location /media/ {
        alias /var/www/media/;
        autoindex off;
        expires 1h;
        add_header X-Content-Type-Options "nosniff";
    }

    location = /healthz/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }
}
