{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}{{ block.super }}
<style>
  /* ITE Attendance theme for Django Administration (green, matching the portal) */
  :root {
    --primary: #41b422;
    --secondary: #2b8416;
    --accent: #f5b301;
    --primary-fg: #fff;
    --header-color: #e9f7e5;
    --header-branding-color: #fff;
    --header-bg: #0f2a14;
    --header-link-color: #fff;
    --breadcrumbs-fg: #d6ecd0;
    --breadcrumbs-link-fg: #fff;
    --breadcrumbs-bg: #2b8416;
    --link-fg: #22820f;
    --link-hover-color: #165c08;
    --link-selected-fg: #165c08;
    --button-bg: #41b422;
    --button-hover-bg: #2b8416;
    --default-button-bg: #2b8416;
    --default-button-hover-bg: #165c08;
    --object-tools-bg: #2b8416;
    --object-tools-hover-bg: #165c08;
    --selected-row: #eaf7e6;
    --font-family-primary: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --link-fg: #7be063; --link-hover-color: #a6f08f; --link-selected-fg: #a6f08f;
      --header-bg: #0a1d0e; --breadcrumbs-bg: #1d5c10; --selected-row: #1b3b17;
    }
  }
  :root[data-theme="dark"] {
    --link-fg: #7be063; --link-hover-color: #a6f08f; --link-selected-fg: #a6f08f;
    --header-bg: #0a1d0e; --breadcrumbs-bg: #1d5c10; --selected-row: #1b3b17;
  }

  body { font-family: var(--font-family-primary); }
  #header { padding: 10px 28px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  #branding h1 { margin: 0; }
  .ite-brand { display: flex; align-items: center; gap: .8rem; }
  .ite-brand img { width: 44px; height: 44px; object-fit: contain; border-radius: 50%; background: #fff; padding: 2px; }
  .ite-brand small { display: block; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: #9fd48f; margin-top: .1rem; }
  #site-name a:link, #site-name a:visited { color: #fff; font-weight: 700; letter-spacing: .01em; }
  div.breadcrumbs { font-weight: 500; }
  #user-tools a { border-bottom: 1px solid rgba(255,255,255,.25); }
  .module { border-radius: 12px; overflow: hidden; border: 1px solid var(--hairline-color); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .module h2, .module caption, .inline-group h2 { background: var(--secondary); letter-spacing: .02em; }
  .module h2 a, .module caption a { color: #fff; }
  .button, input[type=submit], input[type=button], .submit-row input, a.button { border-radius: 8px; }
  .submit-row { border-radius: 12px; }
  #changelist .paginator, #changelist-filter { border-radius: 10px; }
  #changelist-filter h3 { color: var(--secondary); }
  .object-tools a:link, .object-tools a:visited { border-radius: 999px; }
  input[type=text], input[type=password], input[type=number], input[type=email], input[type=url], input[type=date], input[type=time], textarea, select {
    border-radius: 8px;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--primary); outline: 0; box-shadow: 0 0 0 3px rgba(65,180,34,.25); }
  .ite-card { border: 1px solid var(--hairline-color); border-radius: 14px; padding: 18px 20px; margin: 0 0 20px; background: var(--body-bg); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .ite-card h3 { margin: 0 0 8px; font-size: 1.05rem; color: var(--link-fg); }
  .ite-card.danger { border-color: #e5586a; }
  .ite-card.danger h3 { color: #e5586a; }
  .ite-btn { display: inline-block; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; cursor: pointer; background: var(--secondary); color: #fff; text-decoration: none; }
  .ite-btn:hover { background: #165c08; color: #fff; }
  .ite-btn.danger { background: #c02636; }
  .ite-btn.danger:hover { background: #911b28; }
  .ite-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 4px; }
  .ite-stat { border: 1px solid var(--hairline-color); border-radius: 10px; padding: 10px 12px; background: var(--darkened-bg); }
  .ite-stat b { display: block; font-size: 1.35rem; color: var(--link-fg); }
  .ite-stat span { font-size: .78rem; color: var(--body-quiet-color); text-transform: uppercase; letter-spacing: .04em; }
  .ite-note { color: var(--body-quiet-color); font-size: .88rem; line-height: 1.5; }
</style>
{% endblock %}

{% block branding %}
<div class="ite-brand">
  <img src="{% static 'portal/img/ite-logo.png' %}" alt="ITE logo">
  <div>
    <h1 id="site-name"><a href="{% url 'admin:index' %}">{{ site_header }}</a></h1>
    <small>Colegio de Kidapawan &middot; ITE Department</small>
  </div>
</div>
{% endblock %}

{% block userlinks %}
  <a href="{% url 'portal:dashboard' %}">Open portal</a> /
  {{ block.super }}
{% endblock %}
