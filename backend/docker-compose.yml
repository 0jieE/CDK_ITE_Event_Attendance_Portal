# Production-style stack:  nginx (:80/:443) -> web (Gunicorn) -> db (PostgreSQL)
#
#   cp .env.prod.example .env.prod      # then edit it
#   docker compose --env-file .env.prod up -d --build
#
# Optional background fines recompute (Redis + Celery worker + beat):
#   docker compose --env-file .env.prod --profile celery up -d --build
#
# Database: by default Django uses DATABASE_URL from .env.prod (e.g. a managed
# Render/Neon/Supabase PostgreSQL). To run PostgreSQL in a local container
# instead, leave DATABASE_URL unset, set DB_NAME/DB_USER/DB_PASSWORD and add
# `--profile local-db`.
#
# Named volumes: postgres_data (local-db only), media_data (QR PNGs + logo),
# static_data (collectstatic output, shared web -> nginx).

services:
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      # (Postgres refuses to start with an empty password, so no unsafe default.)
      POSTGRES_DB: ${DB_NAME:-qr_attendance}
      POSTGRES_USER: ${DB_USER:-qr_attendance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # Fixed by the compose network, not user-tunable.
      DB_HOST: db
      DB_PORT: "5432"
      STATIC_ROOT: /app/staticfiles
      MEDIA_ROOT: /app/media
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
        required: false     # absent when using an external DATABASE_URL
    expose:
      - "8000"          # reachable by nginx only; not published to the host

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:?run compose with --env-file .env.prod}:80"
      - "${HTTPS_PORT:?run compose with --env-file .env.prod}:443"
    volumes:
      - ./nginx/${NGINX_CONF:?run compose with --env-file .env.prod}:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy

  # ----- optional: background processing (profile "celery") ----------------
  redis:
    image: redis:7-alpine
    profiles: ["celery"]
    restart: unless-stopped

  celery-worker:
    build: .
    profiles: ["celery"]
    restart: unless-stopped
    command: celery -A core worker -l info
    env_file: .env.prod
    environment:
      RUN_SETUP: "0"
      DB_HOST: db
      DB_PORT: "5432"
      MEDIA_ROOT: /app/media
    volumes:
      - media_data:/app/media
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: .
    profiles: ["celery"]
    restart: unless-stopped
    command: celery -A core beat -l info --schedule /tmp/celerybeat-schedule
    env_file: .env.prod
    environment:
      RUN_SETUP: "0"
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  media_data:
  static_data:
